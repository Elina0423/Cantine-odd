
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lutte contre le Gaspillage Alimentaire & ODD</title>
    <style>
        :root {
            --primary-color: #2e7d32;
            --background-color: #f9fbf7;
            --text-color: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 30px 20px;
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0;
            font-size: 26px;
        }

        header p {
            margin: 10px 0 0 0;
            opacity: 0.9;
        }

        .container {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 20px auto;
            box-sizing: border-box;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .link-button {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .link-button:hover {
            background-color: #1b5e20;
        }

        h2 {
            color: var(--primary-color);
            margin: 0;
            font-size: 20px;
        }

        .iframe-wrapper {
            position: relative;
            width: 100%;
            height: 650px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Anti-Gaspillage Alimentaire & ODD</h1>
        <p>Suivi et indicateurs mis à jour en temps réel</p>
    </header>

    <div class="container">
        <div class="actions-bar">
            <h2>Tableau de suivi des denrées et Objectifs</h2>
            <a href="https://docs.google.com/spreadsheets/d/174ZK582M1utcRx39_a5boaGOddPYOm-Oq5p-mSHqqDo/edit?hl=fr" target="_blank" class="link-button">
                Ouvrir dans Google Sheets ↗
            </a>
        </div>

        <div class="iframe-wrapper">
            <iframe src="https://docs.google.com/spreadsheets/d/174ZK582M1utcRx39_a5boaGOddPYOm-Oq5p-mSHqqDo/pubhtml?widget=true&amp;headers=false"></iframe>
        </div>
    </div>

</body>
</html>
