<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur de Gaspillage Quotidien - ODD</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
        }
        h2 {
            color: #2c3e50;
            margin-top: 0;
            text-align: center;
            border-bottom: 2px solid #2ecc71;
            padding-bottom: 10px;
        }
        p {
            font-size: 0.9em;
            color: #7f8c8d;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #34495e;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input:focus, select:focus {
            border-color: #2ecc71;
            outline: none;
        }
        button {
            background-color: #2ecc71;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Gaspillage Quotidien (ODD 12)</h2>
    <p>Saisissez vos données pour alimenter directement le tableur de suivi.</p>
    
    <form id="gaspillageForm">
        <div class="form-group">
            <label for="quantite">Quantité jetée (en grammes) :</label>
            <input type="number" id="quantite" required placeholder="Ex: 250" min="1">
        </div>
        
        <div class="form-group">
            <label for="typeAliment">Type de nourriture / déchet :</label>
            <select id="typeAliment">
                <option value="Restes de repas">Restes de repas / Plats cuisinés</option>
                <option value="Fruits et Légumes">Fruits et Légumes</option>
                <option value="Pain et Féculents">Pain, Pâtes, Riz</option>
                <option value="Produits laitiers et Viandes">Produits laitiers, Viandes, Poissons</option>
            </select>
        </div>

        <button type="submit">Enregistrer sur Google Sheets</button>
    </form>
</div>

<script>
    document.getElementById('gaspillageForm').addEventListener('submit', function(e) {
        e.preventDefault(); // Empêche le rechargement de la page

        const quantite = document.getElementById('quantite').value;
        const type = document.getElementById('typeAliment').value;

        // ⚠️ ÉTAPE OBLIGATOIRE :https://script.google.com/macros/s/AKfycbzWOC03ph5qTC4tcYdHLvdtPV9QD4mbOH8lFmYkoAVr3mrGPkws0iH3fuI2R6QXOXcwEQ/exec
        const urlAppsScript = "https://script.google.com/macros/s/.../exec"; 

        const donneesSaisies = {
            gaspillage: quantite,
            type: type
        };

        // Envoi des données vers votre Google Sheets (ID: 1HqHqBs5T9AHbslxFjG0tzkEB1-HdoYR-UwDinHCywfg)
        fetch(urlAppsScript, {
            method: "POST",
            mode: "no-cors", // Requis pour éviter les erreurs de sécurité (CORS) sur GitHub Pages
            cache: "no-cache",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(donneesSaisies)
        })
        .then(() => {
            alert("Succès ! Vos données ont été ajoutées à la feuille Google Sheets.");
            document.getElementById('gaspillageForm').reset(); // Vide les champs du formulaire
        })
        .catch(error => {
            console.error("Erreur de liaison :", error);
            alert("Impossible d'envoyer les données. Vérifiez la configuration de votre Apps Script.");
        });
    });
</script>

</body>
</html>
