<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lutte contre le Gaspillage Alimentaire</title>
    <style>
        :root {
            --primary-color: #2e7d32; /* Vert écologie */
            --secondary-color: #4caf50; /* Vert clair */
            --background-color: #f9fbf7; /* Fond légèrement teinté */
            --text-color: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 600;
        }

        header p {
            margin: 10px 0 0 0;
            opacity: 0.9;
            font-size: 16px;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .link-button {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .link-button:hover {
            background-color: #1b5e20;
            transform: translateY(-1px);
        }

        h2 {
            color: var(--primary-color);
            margin: 0;
            font-size: 22px;
            border-left: 5px solid var(--primary-color);
            padding-left: 12px;
        }

        /* Style du tableau de données */
        .table-responsive {
            overflow-x: auto;
            margin-top: 20px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 14px 18px;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background-color: #f5f7f5;
            color: #333;
            font-weight: 600;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: #f9fff9;
        }

        #loading {
            text-align: center;
            font-style: italic;
            color: #666;
            padding: 40px;
            font-size: 16px;
        }

        .error-message {
            color: #d32f2f;
            background-color: #ffebee;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #d32f2f;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Anti-Gaspillage Alimentaire</h1>
        <p>Suivi et inventaire des produits connectés en temps réel</p>
    </header>

    <div class="container">
        <div class="actions-bar">
            <h2>Liste des aliments et produits enregistrés</h2>
            <a href="https://docs.google.com/spreadsheets/d/12fo8cluTH5DmI1dZJh2P_iJaso-NmplnEvxcyb5pS0M/edit?gid=169103083#gid=169103083" target="_blank" class="link-button">
                Ouvrir le Google Sheet ↗
            </a>
        </div>

        <div id="loading">🔄 Chargement des données en direct depuis Google Sheets...</div>
        
        <div class="table-responsive" id="table-container" style="display: none;">
            <table id="data-table">
                <thead id="table-head"></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        // Lien d'exportation CSV ciblant spécifiquement votre feuille (gid=169103083)
        const sheetUrl = "https://docs.google.com/spreadsheets/d/12fo8cluTH5DmI1dZJh2P_iJaso-NmplnEvxcyb5pS0M/export?format=csv&gid=169103083";

        // Fonction pour découper correctement une ligne CSV (gère les virgules et points-virgules)
        function splitCsvLine(line) {
            // Détecte si la ligne utilise principalement des points-virgules (standard européen/français)
            const separator = line.includes(';') ? ';' : ',';
            return line.split(separator).map(cell => cell.trim().replace(/^"|"$/g, ''));
        }

        async function fetchSheetData() {
            try {
                const response = await fetch(sheetUrl);
                if (!response.ok) throw new Error("Impossible de récupérer le fichier.");
                
                const data = await response.text();
                
                // Séparation par lignes
                const lines = data.split(/\r?\n/).filter(line => line.trim() !== "");
                
                if (lines.length === 0) {
                    document.getElementById('loading').innerHTML = "<div class='error-message'>Le document Google Sheet semble vide.</div>";
                    return;
                }

                const tableHead = document.getElementById('table-head');
                const tableBody = document.getElementById('table-body');
                
                tableHead.innerHTML = "";
                tableBody.innerHTML = "";

                // 1. Création des en-têtes (Ligne 1 de votre tableau)
                const headers = splitCsvLine(lines[0]);
                const headerRow = document.createElement('tr');
                headers.forEach(headerText => {
                    const th = document.createElement('th');
                    th.textContent = headerText;
                    headerRow.appendChild(th);
                });
                tableHead.appendChild(headerRow);

                // 2. Remplissage des données (Lignes suivantes)
                for (let i = 1; i < lines.length; i++) {
                    const cells = splitCsvLine(lines[i]);
                    
                    // Si la ligne n'a pas le même nombre de colonnes, on l'ajuste ou on passe
                    if (cells.length === 1 && cells[0] === "") continue;

                    const tr = document.createElement('tr');
                    cells.forEach(cellText => {
                        const td = document.createElement('td');
                        td.textContent = cellText;
                        tr.appendChild(td);
                    });
                    tableBody.appendChild(tr);
                }

                // Affichage du tableau et masquage du chargement
                document.getElementById('loading').style.display = 'none';
                document.getElementById('table-container').style.display = 'block';

            } catch (error) {
                console.error("Erreur :", error);
                document.getElementById('loading').innerHTML = `
                    <div class='error-message'>
                        <strong>Erreur de synchronisation.</strong><br> 
                        Assurez-vous d'avoir activé le partage public : <br>
                        <em>Dans Google Sheets : Partager > Section "Accès général" > Choisir "Tous les utilisateurs disposant du lien" en mode Lecteur.</em>
                    </div>`;
            }
        }

        // Lance le chargement dès que la page est prête
        window.addEventListener('DOMContentLoaded', fetchSheetData);
    </script>

</body>
</html>
