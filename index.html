<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur de Gaspillage Quotidien - ODD</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
        }
        h2 {
            color: #2c3e50;
            margin-top: 0;
            text-align: center;
            border-bottom: 2px solid #2ecc71;
            padding-bottom: 10px;
        }
        p {
            font-size: 0.9em;
            color: #7f8c8d;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #34495e;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }
        input:focus, select:focus {
            border-color: #2ecc71;
            outline: none;
        }
        button {
            background-color: #2ecc71;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Gaspillage Quotidien (ODD 12)</h2>
    <p>Renseignez les informations pour mettre à jour le tableau de suivi.</p>
    
    <form id="gaspillageForm">
        <div class="form-group">
            <label for="mois">Mois :</label>
            <select id="mois">
                <option value="Septembre">Septembre</option>
                <option value="Octobre">Octobre</option>
                <option value="Novembre">Novembre</option>
                <option value="Décembre">Décembre</option>
                <option value="Janvier">Janvier</option>
                <option value="Février">Février</option>
                <option value="Mars">Mars</option>
                <option value="Avril">Avril</option>
                <option value="Mai">Mai</option>
                <option value="Juin">Juin</option>
            </select>
        </div>

        <div class="form-group">
            <label for="jour">Jour de la semaine :</label>
            <select id="jour">
                <option value="Lundi">Lundi</option>
                <option value="Mardi">Mardi</option>
                <option value="Jeudi">Jeudi</option>
                <option value="Vendredi">Vendredi</option>
            </select>
        </div>

        <div class="form-group">
            <label for="categorie">Catégorie de déchet :</label>
            <select id="categorie">
                <option value="Déchets alimentaires">Déchets alimentaires</option>
                <option value="Emballages">Emballages</option>
            </select>
        </div>

        <div class="form-group">
            <label for="typeAliment">Type précis :</label>
            <select id="typeAliment">
                <option value="Viande rouge">Viande rouge</option>
                <option value="Viande blanche">Viande blanche</option>
                <option value="Poisson">Poisson</option>
                <option value="Végétarien">Végétarien</option>
                <option value="Pain">Pain</option>
                <option value="Serviettes papier">Serviettes papier</option>
                <option value="Fruits entamés">Fruits entamés</option>
            </select>
        </div>

        <div class="form-group">
            <label for="quantite">Quantité (en grammes ou unités) :</label>
            <input type="number" id="quantite" required placeholder="Ex: 150" min="1">
        </div>

        <button type="submit">Enregistrer sur Google Sheets</button>
    </form>
</div>

<script>
    document.getElementById('gaspillageForm').addEventListener('submit', function(e) {
        e.preventDefault();

        // Récupération de TOUTES les nouvelles variables
        const mois = document.getElementById('mois').value;
        const jour = document.getElementById('jour').value;
        const categorie = document.getElementById('categorie').value;
        const type = document.getElementById('typeAliment').value;
        const quantite = document.getElementById('quantite').value;

        //https://script.google.com/macros/s/AKfycbzkZnIPnuLd1BsexJl36jnN-xqKT_0EwLnzsqSIMikYB8bI5Jt7VbasMVeVI34WzB4SkQ/exec

        const donneesSaisies = {
            mois: mois,
            jour: jour,
            categorie: categorie,
            type: type,
            gaspillage: quantite
        };

        fetch(urlAppsScript, {
            method: "POST",
            mode: "no-cors",
            cache: "no-cache",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(donneesSaisies)
        })
        .then(() => {
            alert("Succès ! Les données ont été ajoutées à votre tableau ODD.");
            document.getElementById('gaspillageForm').reset();
        })
        .catch(error => {
            console.error("Erreur :", error);
            alert("Erreur lors de l'envoi.");
        });
    });
</script>

</body>
</html>
